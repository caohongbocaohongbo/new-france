name: Principal Capital Scan

on:
  schedule:
    # GitHub 定时触发不守时（常延迟数十分钟甚至丢触发），因此不再依赖 cron
    # 的整点精度：每个交易时段仅需触发「一次」进入 job，随后由 job 内部自循环
    # 每 5 分钟扫描一次直至收盘。这里在两段开盘前后各撒多个冗余触发点，
    # 只要 GitHub 命中其中任意一个即可覆盖整段（重复触发由 concurrency 抑制）。
    #
    # ── 上午盘 北京 9:30 开盘 (UTC 1:30) ──
    - cron: '20,25,30,35,40 1 * * 1-5'   # 北京 9:20/9:25/9:30/9:35/9:40
    # ── 下午盘 北京 13:00 开盘 (UTC 5:00) ──
    - cron: '50,55 4 * * 1-5'            # 北京 12:50/12:55
    - cron: '0,5,10 5 * * 1-5'           # 北京 13:00/13:05/13:10
  workflow_dispatch:
    inputs:
      buy_threshold:
        description: '买入阈值(%)'
        default: '50'
      sell_threshold:
        description: '卖出阈值(%)'
        default: '30'
      force:
        description: '强制运行（忽略交易时段）'
        type: boolean
        default: false
      enable_verify:
        description: '启用 sina 抽样核验'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: principal-capital-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  DATA_BRANCH: data-snapshots

jobs:
  scan:
    runs-on: ubuntu-latest
    # 覆盖单个交易时段全程（上午盘约 2h10m / 下午盘约 2h），job 内自循环每 5 分钟扫描一次
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check workflow SHA freshness
        id: freshness
        run: |
          git fetch origin "${BASE_BRANCH}" --prune
          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          if [ "${head_sha}" != "${remote_sha}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "旧提交 workflow，不执行主力资金主链路"
            echo "::warning::旧提交 workflow，本次未执行主力资金扫描（stale skip）"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.stale != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.freshness.outputs.stale != 'true'
        run: pip install -r requirements.txt

      - name: Restore generated data snapshot
        if: steps.freshness.outputs.stale != 'true'
        run: bash scripts/restore_screening_data.sh

      - name: Run principal capital scan (loop until market close)
        if: steps.freshness.outputs.stale != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          BUY_THRESHOLD: ${{ github.event.inputs.buy_threshold || '50' }}
          SELL_THRESHOLD: ${{ github.event.inputs.sell_threshold || '30' }}
          ENABLE_VERIFY_FLAG: ${{ github.event.inputs.enable_verify == 'true' && '--enable-verify' || '' }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          # ── 自循环：每 5 分钟扫描一次，直至本时段收盘 ──
          # 触发点无论早晚，只要落在交易日内进入循环即可覆盖整段。
          # 时段判定：触发时刻在北京 12:00 前 → 上午盘（收于 11:30）；否则下午盘（收于 15:00）。
          #   这样上午盘 job 不会空占午休（11:30–13:00）时段。
          # 手动 workflow_dispatch 带 --force 时，只跑一轮即退出，避免非交易时段空转。
          scan_once() {
            timeout --signal=TERM 120 \
            python -m backend.main --run-principal-capital-scan \
              --buy-threshold "${BUY_THRESHOLD}" \
              --sell-threshold "${SELL_THRESHOLD}" \
              ${ENABLE_VERIFY_FLAG} \
              ${FORCE_FLAG} || echo "本轮扫描非零退出（继续下一轮）"
          }

          # 手动强制运行：仅一轮
          if [ -n "${FORCE_FLAG}" ]; then
            scan_once
            bash scripts/commit_screening_data.sh || echo "快照提交失败（忽略）"
            exit 0
          fi

          start_hm="$(TZ=Asia/Shanghai date +%H%M)"
          if [ "${start_hm}" -lt 1200 ]; then
            SESSION_END=1130   # 上午盘
            echo "进入上午盘循环（收于 11:30），触发时刻北京 ${start_hm}"
          else
            SESSION_END=1500   # 下午盘
            echo "进入下午盘循环（收于 15:00），触发时刻北京 ${start_hm}"
          fi

          while true; do
            bj_hm="$(TZ=Asia/Shanghai date +%H%M)"
            if [ "${bj_hm}" -ge "${SESSION_END}" ]; then
              echo "北京 ${bj_hm} 已达本时段收盘 ${SESSION_END}，结束循环"
              break
            fi
            echo "===== 北京 ${bj_hm} 开始一轮扫描 ====="
            scan_once
            bash scripts/commit_screening_data.sh || echo "快照提交失败（忽略，继续下一轮）"

            bj_hm="$(TZ=Asia/Shanghai date +%H%M)"
            if [ "${bj_hm}" -ge "${SESSION_END}" ]; then
              echo "北京 ${bj_hm} 已达本时段收盘 ${SESSION_END}，结束循环"
              break
            fi
            echo "等待 5 分钟进入下一轮..."
            sleep 300
          done
