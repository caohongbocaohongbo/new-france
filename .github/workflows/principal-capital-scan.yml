name: Principal Capital Scan

on:
  schedule:
    # ── 上午盘 北京 9:30–11:30 (UTC 1:30–3:30) ──
    - cron: '30-55/5 1 * * 1-5'   # 9:30,9:35,...,9:55
    - cron: '*/5 2 * * 1-5'       # 10:00–10:55
    - cron: '0-30/5 3 * * 1-5'    # 11:00,11:05,...,11:30
    # ── 下午盘 北京 13:00–14:55 (UTC 5:00–6:55) ──
    - cron: '*/5 5 * * 1-5'       # 13:00–13:55
    - cron: '*/5 6 * * 1-5'       # 14:00–14:55
  workflow_dispatch:
    inputs:
      buy_threshold:
        description: '买入阈值(%)'
        default: '50'
      sell_threshold:
        description: '卖出阈值(%)'
        default: '30'
      force:
        description: '强制运行（忽略交易时段）'
        type: boolean
        default: false
      enable_verify:
        description: '启用 sina 抽样核验'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: principal-capital-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  DATA_BRANCH: data-snapshots

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check workflow SHA freshness
        id: freshness
        run: |
          git fetch origin "${BASE_BRANCH}" --prune
          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          if [ "${head_sha}" != "${remote_sha}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "旧提交 workflow，不执行主力资金主链路"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.stale != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.freshness.outputs.stale != 'true'
        run: pip install -r requirements.txt

      - name: Restore generated data snapshot
        if: steps.freshness.outputs.stale != 'true'
        run: bash scripts/restore_screening_data.sh

      - name: Run principal capital scan
        if: steps.freshness.outputs.stale != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m backend.main --run-principal-capital-scan \
            --buy-threshold ${{ github.event.inputs.buy_threshold || '50' }} \
            --sell-threshold ${{ github.event.inputs.sell_threshold || '30' }} \
            ${{ github.event.inputs.enable_verify == 'true' && '--enable-verify' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit generated data snapshot
        if: always() && steps.freshness.outputs.stale != 'true'
        run: bash scripts/commit_screening_data.sh
