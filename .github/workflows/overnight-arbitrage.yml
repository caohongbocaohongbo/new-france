name: Overnight Arbitrage Decision
on:
  schedule:
    # 北京时间 14:43 = UTC 06:43，交易日（周一到周五）
    - cron: '43 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overnight-arbitrage-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  DATA_BRANCH: data-snapshots

jobs:
  overnight-arbitrage:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check workflow SHA freshness
        id: freshness
        run: |
          git fetch origin "${BASE_BRANCH}" --prune
          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          echo "head_sha=${head_sha}"
          echo "remote_sha=${remote_sha}"
          if [ "${head_sha}" != "${remote_sha}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "旧提交 workflow，不执行 overnight arbitrage 主链路"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.stale != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.freshness.outputs.stale != 'true'
        run: pip install -r requirements.txt

      - name: Restore generated data snapshot
        if: steps.freshness.outputs.stale != 'true'
        run: bash scripts/restore_screening_data.sh

      - name: Run overnight arbitrage decision
        if: steps.freshness.outputs.stale != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        # GitHub 定时任务可能延迟数小时，只保留快照能力，不发送正式决策邮件。
        run: python -m backend.main --run-overnight-arbitrage --dry-run

      - name: Commit generated data snapshot
        if: always() && steps.freshness.outputs.stale != 'true'
        run: bash scripts/commit_screening_data.sh
