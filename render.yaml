# Render Blueprint — New France 涨停回撤选股系统
# 文档: https://render.com/docs/blueprint-spec

services:
  # ---- 后端 API ----
  - type: web
    name: new-france-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main --serve
    envVars:
      - key: BREVO_API_KEY
        sync: false
      - key: OA_TRIGGER_TOKEN
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USER
        value: "caohongbo183760584@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TO
        value: "896256756@qq.com"
      - key: DEBUG
        value: "false"

  # ---- 定时任务 (每日筛选) ----
  - type: cron
    name: new-france-daily-screening
    env: python
    region: oregon
    schedule: "10 7 * * 1-5"  # UTC 07:10 = 北京时间 15:10
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main
    envVars:
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USER
        value: "caohongbo183760584@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TO
        value: "896256756@qq.com"

  # ---- 定时任务 (隔夜套利，UTC 06:43 = 北京时间 14:43，周一至周五) ----
  - type: cron
    name: new-france-overnight-arbitrage
    env: python
    region: oregon
    schedule: "43 6 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main --run-overnight-arbitrage
    envVars:
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USER
        value: "caohongbo183760584@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TO
        value: "896256756@qq.com"

# ---- 前端静态站点 ----
staticSites:
  - name: new-france
    buildCommand: echo "Static site — no build required"
    publishPath: frontend
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
